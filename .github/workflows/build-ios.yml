name: Build Open Grind for iOS

# Revisa el repositorio oficial cada 6 horas. Si hay commits nuevos,
# compila un .ipa sin firmar, lo publica como Release y actualiza
# source.json (fuente para SideStore / AltStore / Feather).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Compilar aunque no haya commits nuevos"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-ios
  cancel-in-progress: false

env:
  UPSTREAM: https://git.opengrind.org/open-grind/open-grind.git
  UPSTREAM_MIRROR: https://github.com/VityaSchel/open-grind.git
  BUN_VERSION: "1.3.13"
  KEEP_RELEASES: "5"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.up.outputs.sha }}
      remote: ${{ steps.up.outputs.remote }}
      build: ${{ steps.up.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: up
        name: Ver último commit del repositorio oficial
        run: |
          REMOTE="$UPSTREAM"
          SHA=$(git ls-remote "$UPSTREAM" HEAD 2>/dev/null | cut -f1 || true)
          if [ -z "$SHA" ]; then
            echo "Servidor oficial no responde, uso el espejo de GitHub"
            REMOTE="$UPSTREAM_MIRROR"
            SHA=$(git ls-remote "$UPSTREAM_MIRROR" HEAD | cut -f1)
          fi
          LAST=$(cat .upstream-sha 2>/dev/null || echo none)
          echo "upstream=$SHA  último compilado=$LAST"
          BUILD=false
          if [ "$SHA" != "$LAST" ] || [ "${{ inputs.force }}" = "true" ]; then BUILD=true; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout de este repo
        uses: actions/checkout@v4
        with:
          path: self

      - name: Clonar Open Grind en el commit exacto
        run: |
          git init -q og && cd og
          git remote add origin "${{ needs.check.outputs.remote }}"
          git fetch -q --depth 1 origin "${{ needs.check.outputs.sha }}"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Rust (usa rust-toolchain.toml del proyecto, incluye targets iOS)
        working-directory: og
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios

      - name: Herramientas de Xcode
        run: |
          brew install xcodegen || true
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Permisos de iOS (ubicación, cámara, fotos)
        run: |
          [ -f og/src-tauri/Info.ios.plist ] || cp self/Info.ios.plist og/src-tauri/Info.ios.plist

      - name: Versión numérica para iOS
        run: |
          python3 - <<'EOF'
          import json, re
          p = "og/src-tauri/tauri.conf.json"
          c = json.load(open(p))
          core = re.match(r"\d+\.\d+\.\d+", c["version"]).group(0)
          print(c["version"], "->", core, "build ${{ github.run_number }}")
          c["version"] = core
          c.setdefault("bundle", {}).setdefault("iOS", {})["bundleVersion"] = "${{ github.run_number }}"
          json.dump(c, open(p, "w"), indent="\t")
          EOF

      - name: Instalar dependencias
        working-directory: og
        run: bun install --frozen-lockfile

      - name: Generar proyecto Xcode
        working-directory: og
        run: |
          rm -rf src-tauri/gen/apple
          bun tauri ios init --ci

      - name: Compilar .ipa sin firmar
        working-directory: og
        run: bun tauri ios build --no-sign --ci --target aarch64

      - name: Localizar .ipa y leer versión
        id: ipa
        run: |
          IPA=$(find og/src-tauri/gen/apple/build -name "*.ipa" | head -1)
          [ -n "$IPA" ] || { echo "No se generó el .ipa"; exit 1; }
          mkdir -p out && cp "$IPA" out/OpenGrind.ipa
          unzip -q -o out/OpenGrind.ipa -d out/x
          PLIST=$(find out/x/Payload -maxdepth 2 -name Info.plist | head -1)
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILDV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$PLIST" 2>/dev/null || echo 14.0)
          SHORT=$(echo "${{ needs.check.outputs.sha }}" | cut -c1-7)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "buildv=$BUILDV" >> "$GITHUB_OUTPUT"
          echo "bid=$BID" >> "$GITHUB_OUTPUT"
          echo "minos=$MINOS" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "tag=ios-$VER-$BUILDV-$SHORT" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -f%z out/OpenGrind.ipa)" >> "$GITHUB_OUTPUT"
          shasum -a 256 out/OpenGrind.ipa | tee out/OpenGrind.ipa.sha256

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd self
          gh release create "${{ steps.ipa.outputs.tag }}" \
            ../out/OpenGrind.ipa ../out/OpenGrind.ipa.sha256 \
            --title "Open Grind iOS ${{ steps.ipa.outputs.version }} (${{ steps.ipa.outputs.short }})" \
            --notes "Compilación automática sin firmar del commit oficial ${{ needs.check.outputs.sha }}. No es una versión oficial de Open Grind."

      - name: Actualizar source.json y estado
        run: |
          cd self
          cp ../og/src-tauri/icons/ios/AppIcon-512@2x.png icon.png 2>/dev/null || true
          python3 scripts/update_source.py \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --tag "${{ steps.ipa.outputs.tag }}" \
            --version "${{ steps.ipa.outputs.version }}" \
            --build "${{ steps.ipa.outputs.buildv }}" \
            --bundle-id "${{ steps.ipa.outputs.bid }}" \
            --min-os "${{ steps.ipa.outputs.minos }}" \
            --size "${{ steps.ipa.outputs.size }}" \
            --commit "${{ needs.check.outputs.sha }}"
          echo "${{ needs.check.outputs.sha }}" > .upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json .upstream-sha
          [ -f icon.png ] && git add icon.png
          git commit -m "iOS build ${{ steps.ipa.outputs.tag }}"
          git push

      - name: Borrar Releases viejas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd self
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^ios-' | tail -n +$((KEEP_RELEASES + 1)) \
            | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
